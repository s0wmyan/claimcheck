[project]
name = "claimcheck"
version = "0.1.0"
description = "Retrieval-augmented fact-checker for scientific claims, evaluated on SciFact"
requires-python = ">=3.10"
dependencies = ["numpy", "requests", "streamlit"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claimcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
